<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanks — Zyqerion</title>
  <style>
    :root {
      --bg: #06101d;
      --text: #f5f7fb;
      --muted: #aab6c7;
      --border: rgba(255,255,255,0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(116,170,255,0.18), transparent 30%),
        linear-gradient(180deg, var(--bg) 0%, #081426 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      max-width: 760px;
      width: 100%;
      padding: 28px;
      border-radius: 24px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.4rem);
      letter-spacing: -0.04em;
    }

    p {
      color: var(--muted);
      margin: 0 0 18px;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #b4cbff, #d3e0ff);
      color: #08111f;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Your idea has been submitted</h1>
    <p>
      Thanks for submitting your startup idea to Zyqerion.
    </p>
    <p>
      A founder-style evaluation will review the opportunity, competition, and next steps for your concept.
    </p>
    <a class="btn" href="/demo.html">Try another idea</a>
  </div>
</body>
</html>
