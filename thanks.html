<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanks — Zyqerion</title>
  <style>
    :root {
      --bg: #020503;
      --text: #f5f7fb;
      --muted: #a8b3ab;
      --border: rgba(86,255,120,0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(57,255,92,0.12), transparent 26%),
        radial-gradient(circle at 80% 10%, rgba(57,255,92,0.08), transparent 22%),
        linear-gradient(180deg, #010302 0%, #07110a 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      max-width: 760px;
      width: 100%;
      padding: 28px;
      border-radius: 24px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      text-align: center;
      box-shadow: 0 0 40px rgba(57,255,92,0.12), 0 0 120px rgba(57,255,92,0.04);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.4rem);
      letter-spacing: -0.04em;
    }

    p {
      color: var(--muted);
      margin: 0 0 18px;
      line-height: 1.6;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7dff96, #39ff5c);
      color: #031006;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(86,255,120,0.14);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Thanks — you're in</h1>
    <p>
      Your submission has been received by Zyqerion.
    </p>
    <p>
      If you joined early access, you’ll receive updates and priority access as Zyqerion evolves.
      If you submitted a paid founder evaluation request, your manual evaluation will be delivered within 24 hours.
    </p>

    <div class="btn-row">
      <a class="btn btn-primary" href="/demo.html">Try the demo</a>
      <a class="btn btn-secondary" href="/">Back to site</a>
    </div>
  </div>
</body>
</html>
